name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A push that supersedes an in-flight run cancels it: the old
# result is already obsolete, and runners are a shared, finite resource.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; nothing here needs to write back to the repo.
permissions:
  contents: read

jobs:
  regress:
    name: regress (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The whole suite is seconds of filesystem work. Ten minutes means "something
    # is wedged", not "the machine is slow" — fail loudly instead of burning an hour.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node version
        run: node --version

      - name: 回归套件（文件场景，无需 GUI）
        run: node scripts/regress.ts

      - name: 文档站可构建
        run: node scripts/build-docs.ts

  # Linux 的真机验证：Xvfb + xterm + xdotool，跑窗口级驱动冒烟。
  # 本地开发在 Windows，所以 Linux 行为只能由这里证明。
  linux-ui:
    name: linux-ui (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 X11 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xterm xdotool wmctrl openbox

      - name: 驱动契约（纯内存，不依赖桌面）
        run: node scripts/contract-test.ts

      - name: Linux 驱动冒烟（Xvfb）
        run: |
          # 裸 Xvfb 没有窗口管理器，wmctrl 拿不到 _NET_CLIENT_LIST；
          # openbox 提供 EWMH，激活/移动窗口才有语义。
          xvfb-run -a --server-args="-screen 0 1280x800x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; node scripts/linux-driver-smoke.ts' 
