name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 回归套件（文件场景，无需 GUI）
        run: node scripts/regress.ts
      - name: 文档站可构建
        run: node scripts/build-docs.ts
