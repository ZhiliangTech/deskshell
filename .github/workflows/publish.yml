name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - run: node scripts/regress.ts
      - id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 已经在这个 registry 上，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 公共 npm 只在配了 NPM_TOKEN secret 时真正发布；没配就整段跳过。
  # job 级 if 读不到 secrets，所以用 gate step 先判断再决定后续步骤跑不跑。
  npm-public:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN 未配置，跳过公共 npm 发布"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: node scripts/regress.ts
        if: steps.gate.outputs.ok == 'true'
      - id: exists
        if: steps.gate.outputs.ok == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 已经在公共 npm 上，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ok == 'true' && steps.exists.outputs.skip != 'true'
        run: npm publish --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.gate.outputs.ok == 'true' && steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "等 registry 处理完再核对（上传后有一段处理窗口，立刻查会 404）"
          # 查的是"这个版本在不在"，不是 dist-tag —— dist-tag 比版本本身慢一拍，
          # 0.18.7 那次就是这里误读成 0.18.6。
          for i in 1 2 3 4 5 6 7 8; do
            sleep 20
            if PUBLISHED=$(npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null); then
              echo "公共 npm 上已存在 $PUBLISHED"
              npm view "$NAME" version --registry https://registry.npmjs.org | sed 's/^/公共 npm latest = /'
              exit 0
            fi
          done
          echo "80 秒内还没查到 $NAME@$VERSION —— 去 https://www.npmjs.com/package/$NAME?activeTab=versions 人工确认"
          exit 1
