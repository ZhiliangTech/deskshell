name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - run: node scripts/regress.ts
      - id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 已经在这个 registry 上，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 公共 npm 只在配了 NPM_TOKEN secret 时真正发布；没配就整段跳过。
  # job 级 if 读不到 secrets，所以用 gate step 先判断再决定后续步骤跑不跑。
  npm-public:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN 未配置，跳过公共 npm 发布"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: node scripts/regress.ts
        if: steps.gate.outputs.ok == 'true'
      - run: npm publish --access public
        if: steps.gate.outputs.ok == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
