<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="14%" r="46%">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E9DC" stop-opacity="1"/>
      <stop offset="1" stop-color="#F2E9DC" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0B0F14"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- 标志 -->
  <g transform="translate(512 92)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="#111721" stroke="#202836" stroke-width="2"/>
    <rect x="64" y="64" width="140" height="140" rx="26" fill="#FF7A59" transform="rotate(-9 134 134)"/>
    <rect x="46" y="52" width="148" height="148" rx="26" fill="#F2E9DC"/>
    <path d="M82 108 l24 20 l-24 20" fill="none" stroke="#0B0F14" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 150 h30" stroke="#0B0F14" stroke-width="13" stroke-linecap="round"/>
    <circle cx="72" cy="176" r="8.5" fill="#3FB950"/>
  </g>

  <!-- 字标 -->
  <text x="640" y="410" text-anchor="middle" fill="url(#fade)" font-size="86" font-weight="700" letter-spacing="-2.5">deskshell</text>
  <text x="640" y="458" text-anchor="middle" fill="#FF7A59" font-size="25" font-weight="600" letter-spacing="3">PREVIEW · VERIFY · UNDO · AUDIT</text>

  <!-- 能力胶囊 -->
  <g font-size="17" font-weight="500">
    <rect x="332" y="492" width="142" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="403" y="518" text-anchor="middle" fill="#c9d1d9">any action</text>
    <rect x="490" y="492" width="150" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="565" y="518" text-anchor="middle" fill="#c9d1d9">undoable</text>
    <rect x="656" y="492" width="150" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="731" y="518" text-anchor="middle" fill="#c9d1d9">auditable</text>
    <rect x="822" y="492" width="126" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="885" y="518" text-anchor="middle" fill="#c9d1d9">no model</text>
  </g>

  <!-- 页脚 -->
  <text x="640" y="596" text-anchor="middle" fill="#6e7681" font-size="17" font-family="ui-monospace, Consolas, monospace">github.com/ciceroyang/deskshell</text>
</svg>
