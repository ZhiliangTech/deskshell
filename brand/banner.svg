<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#0B0F14"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="170" cy="220" r="260" fill="url(#glow)"/>

  <!-- 标志 -->
  <g transform="translate(96 104) scale(0.82)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="#111721" stroke="#202836" stroke-width="2"/>
    <rect x="64" y="64" width="140" height="140" rx="26" fill="#FF7A59" transform="rotate(-9 134 134)"/>
    <rect x="46" y="52" width="148" height="148" rx="26" fill="#F2E9DC"/>
    <path d="M82 108 l24 20 l-24 20" fill="none" stroke="#0B0F14" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 150 h30" stroke="#0B0F14" stroke-width="13" stroke-linecap="round"/>
    <circle cx="72" cy="176" r="8.5" fill="#3FB950"/>
  </g>

  <!-- 字标 -->
  <text x="372" y="204" fill="#F2E9DC" font-size="96" font-weight="700" letter-spacing="-2">deskshell</text>
  <text x="376" y="258" fill="#FF7A59" font-size="29" font-weight="600" letter-spacing="1.5">PREVIEW · VERIFY · UNDO · AUDIT</text>
  <text x="376" y="302" fill="#8B949E" font-size="21">A protocol-first shell for AI computer control · zero model dependency</text>

  <text x="1152" y="352" fill="#3FB950" font-family="ui-monospace, Consolas, monospace" font-size="34" opacity="0.6">&gt;_</text>
</svg>
