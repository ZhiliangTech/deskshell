<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- Skill 层 -->
  <rect x="40" y="34" width="600" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="62" fill="#c9d1d9" font-size="15" font-weight="600">Skill（社区写，一个场景一个目录）</text>
  <text x="60" y="86" fill="#8b949e" font-size="13">plan() → Action[]　·　不碰系统 API，不写回滚逻辑</text>
  <text x="60" y="106" fill="#58a6ff" font-size="12">downloads-cleanup · browser-tabs · tile-windows</text>

  <!-- Kernel -->
  <rect x="40" y="168" width="600" height="122" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="60" y="196" fill="#c9d1d9" font-size="15" font-weight="600">Kernel（维护者把关，接口冻结）</text>
  <g font-size="12.5" fill="#c9d1d9">
    <rect x="60" y="210" width="112" height="30" rx="15" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="116" y="230" text-anchor="middle" fill="#79c0ff">权限校验</text>
    <rect x="184" y="210" width="96" height="30" rx="15" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="232" y="230" text-anchor="middle" fill="#79c0ff">预览</text>
    <rect x="292" y="210" width="128" height="30" rx="15" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="356" y="230" text-anchor="middle" fill="#79c0ff">执行 → 断言</text>
    <rect x="432" y="210" width="188" height="30" rx="15" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="526" y="230" text-anchor="middle" fill="#79c0ff">失败回滚（含自身副作用）</text>
  </g>
  <text x="60" y="272" fill="#8b949e" font-size="12.5">零模型依赖　·　每条动作必须有 post 断言与 undo</text>

  <!-- Driver -->
  <rect x="40" y="320" width="600" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="348" fill="#c9d1d9" font-size="15" font-weight="600">Driver（按平台实现，可替换）</text>
  <g font-size="12.5">
    <rect x="60" y="360" width="150" height="28" rx="6" fill="#23863633" stroke="#2ea043"/>
    <text x="135" y="379" text-anchor="middle" fill="#7ee787">Windows · UIA</text>
    <rect x="222" y="360" width="150" height="28" rx="6" fill="#23863633" stroke="#2ea043"/>
    <text x="297" y="379" text-anchor="middle" fill="#7ee787">macOS · AX 桥</text>
    <rect x="384" y="360" width="120" height="28" rx="6" fill="#6e768133" stroke="#6e7681"/>
    <text x="444" y="379" text-anchor="middle" fill="#c9d1d9">Mock</text>
  </g>

  <!-- Journal -->
  <rect x="676" y="168" width="244" height="238" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="696" y="196" fill="#c9d1d9" font-size="15" font-weight="600">Journal</text>
  <text x="696" y="218" fill="#8b949e" font-size="12.5">append-only JSONL</text>
  <g font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#8b949e">
    <text x="696" y="246">{"status":"ok", ...}</text>
    <text x="696" y="266">{"status":"failed", ...}</text>
    <text x="696" y="286">{"status":"rolled-back", ...}</text>
  </g>
  <text x="696" y="316" fill="#c9d1d9" font-size="12.5">谁在什么时候改了什么</text>
  <text x="696" y="338" fill="#8b949e" font-size="12.5">撤销时按 taskId 逆序重放</text>
  <text x="696" y="368" fill="#7ee787" font-size="12.5">deskshell journal</text>
  <text x="696" y="388" fill="#7ee787" font-size="12.5">deskshell undo --task &lt;id&gt;</text>

  <!-- 箭头 -->
  <line x1="340" y1="120" x2="340" y2="164" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="352" y="146" fill="#8b949e" font-size="12">Action[]</text>

  <line x1="340" y1="290" x2="340" y2="316" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="352" y="308" fill="#8b949e" font-size="12">observe / act</text>

  <line x1="640" y1="230" x2="672" y2="230" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="600" y="222" fill="#58a6ff" font-size="12">每一步</text>
</svg>
